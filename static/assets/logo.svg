<svg xmlns="http://www.w3.org/2000/svg" viewBox="-500 -500 1000 1000">
  <defs>
    <!-- Gradiente global -->
    <radialGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="90%" stop-color="#ffffff" />
    </radialGradient>

    <defs>
      <linearGradient id="golden-gradient">
        <stop stop-color="#b8860b" offset="0"   ></stop>          
        <stop stop-color="#ffd700" offset="50%" ></stop>
        <stop stop-color="#fff1a6" offset="100%" ></stop>
      </linearGradient>
    </defs>

    <!-- Máscara con tus formas -->
    <mask id="mask">
      <g transform="scale(1, -1)" stroke="white" stroke-width="30" fill="none" stroke-linecap="round">
        <polygon id="eq-tri" points="0 450, -218 -125, 218 -125" />
        <use href="#eq-tri" transform="rotate(30)"/>
        <use href="#eq-tri" transform="rotate(60)"/>
        <use href="#eq-tri" transform="rotate(90)"/>
        <use href="#eq-tri" transform="rotate(120)"/>
        <use href="#eq-tri" transform="rotate(150)"/>
        <use href="#eq-tri" transform="rotate(180)"/>
        <use href="#eq-tri" transform="rotate(210)"/>
        <use href="#eq-tri" transform="rotate(240)"/>
        <use href="#eq-tri" transform="rotate(270)"/>
        <use href="#eq-tri" transform="rotate(300)"/>
        <use href="#eq-tri" transform="rotate(330)"/>
        <circle r="120"/>
      </g>
    </mask>
  </defs>
  <rect x="-500" y="-500" width="1000" height="1000" fill="url(#golden-gradient)" mask="url(#mask)"/>
</svg>
